<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VXLEngine – SRTM voxel terrain</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <aside id="panel">
      <h1>VXLEngine</h1>
      <p class="sub">SRTM terrain, rendered as voxels</p>

      <div id="status">
        <span id="status-text">Starting…</span>
        <div class="bar"><div id="status-bar"></div></div>
      </div>

      <fieldset>
        <legend>Mode</legend>
        <div class="segmented">
          <label><input type="radio" name="mode" value="voxel" checked /><span>Voxel</span></label>
          <label><input type="radio" name="mode" value="smooth" /><span>Smooth</span></label>
        </div>
      </fieldset>

      <label class="row">
        <span>Resolution</span>
        <select id="cell">
          <option value="2000">2 km</option>
          <option value="1000">1 km</option>
          <option value="500" selected>500 m</option>
          <option value="250">250 m</option>
          <option value="150">150 m</option>
        </select>
      </label>

      <label class="row">
        <span>Exaggeration <output id="exag-out">4×</output></span>
        <input id="exag" type="range" min="1" max="20" step="0.5" value="4" />
      </label>

      <label class="row">
        <span>Sun azimuth <output id="sun-out">225°</output></span>
        <input id="sun" type="range" min="0" max="359" step="1" value="225" />
      </label>

      <label class="check"><input id="grid" type="checkbox" checked /> Block outlines</label>

      <dl id="stats"></dl>
      <p class="help">Drag: rotate · Right-drag: pan · Scroll: zoom · Double-click: focus</p>
    </aside>

    <div id="hover"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
